name: Version Check

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review]

jobs:
  check-version-bumped:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare versions against master
        run: |
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          MARKETPLACE_VERSION=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          MASTER_VERSION=$(git show origin/master:.claude-plugin/plugin.json | jq -r '.version')

          echo "master version:      $MASTER_VERSION"
          echo "plugin.json:         $PLUGIN_VERSION"
          echo "marketplace.json:    $MARKETPLACE_VERSION"

          if [ "$PLUGIN_VERSION" = "$MASTER_VERSION" ]; then
            echo "::error file=.claude-plugin/plugin.json::Version not bumped. Current: $MASTER_VERSION — update version in plugin.json and marketplace.json before merging."
            exit 1
          fi

          if [ "$PLUGIN_VERSION" != "$MARKETPLACE_VERSION" ]; then
            echo "::error file=.claude-plugin/marketplace.json::Version mismatch: plugin.json=$PLUGIN_VERSION marketplace.json=$MARKETPLACE_VERSION — keep them identical."
            exit 1
          fi

          echo "Version bump confirmed: $MASTER_VERSION → $PLUGIN_VERSION"
